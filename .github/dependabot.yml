version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "16:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10

    groups:
      production-dependencies:
        dependency-type: "production"

      development-dependencies:
        dependency-type: "development"

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"
